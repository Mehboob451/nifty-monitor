<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nifty AI Intelligence Monitor</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f0f0f; 
            color: #e0e0e0; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }
        h1 { color: #ffffff; margin-bottom: 10px; }
        .timestamp { color: #888; margin-bottom: 30px; font-size: 0.9em; }
        
        .dashboard-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            width: 100%; 
            max-width: 1000px; 
        }

        .card { 
            background: #1a1a1a; 
            padding: 25px; 
            border-radius: 16px; 
            border: 1px solid #333; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .label { color: #aaa; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .value { font-size: 2.2em; font-weight: bold; }
        
        /* Dynamic Colors for Bias */
        .bias-Bullish { color: #00ff88; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .bias-Bearish { color: #ff4444; text-shadow: 0 0 10px rgba(255,68,68,0.3); }
        .bias-Neutral { color: #cccccc; }

        .score-box { 
            grid-column: 1 / -1; 
            background: linear-gradient(145deg, #1a1a1a, #252525);
            border: 1px solid #ffcc00; 
        }
        .score-value { color: #ffcc00; font-size: 3em; }

        .range-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 10px 0; 
            border-bottom: 1px solid #333; 
        }
        .range-item:last-child { border-bottom: none; }
        .range-time { color: #888; }
        .range-price { font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <h1>Nifty AI Intelligence</h1>
    <div class="timestamp">Last Updated: <span id="time">Loading...</span></div>

    <div class="dashboard-grid">
        <!-- Price Card -->
        <div class="card">
            <div class="label">Current Nifty Price</div>
            <div id="price" class="value">---</div>
        </div>

        <!-- Bias Card -->
        <div class="card">
            <div class="label">AI Market Bias</div>
            <div id="bias" class="value bias-Neutral">Loading...</div>
        </div>

        <!-- Accuracy Card -->
        <div class="card score-box">
            <div class="label">Bot Prediction Accuracy (Scorecard)</div>
            <div id="score" class="score-value">0%</div>
        </div>

        <!-- Ranges Card -->
        <div class="card" style="grid-column: 1 / -1;">
            <div class="label" style="margin-bottom: 20px;">Expected Price Ranges</div>
            <div class="range-item">
                <span class="range-time">Next 15 Minutes</span>
                <span id="r15" class="range-price">---</span>
            </div>
            <div class="range-item">
                <span class="range-time">Next 30 Minutes</span>
                <span id="r30" class="range-price">---</span>
            </div>
            <div class="range-item">
                <span class="range-time">Next 1 Hour</span>
                <span id="r60" class="range-price">---</span>
            </div>
        </div>
    </div>

    <script>
        async function updateDashboard() {
            try {
                // Fetch the JSON file from the GitHub Pages site
                const response = await fetch('data.json');
                const data = await response.json();

                // Update elements
                document.getElementById('time').innerText = data.timestamp;
                document.getElementById('price').innerText = data.price;
                
                const biasEl = document.getElementById('bias');
                biasEl.innerText = data.bias;
                biasEl.className = 'value bias-' + data.bias;
                
                document.getElementById('score').innerText = data.hit_rate + '%';
                
                document.getElementById('r15').innerText = data.ranges['15m'].map(n=>n.toFixed(2)).join(' - ');
                document.getElementById('r30').innerText = data.ranges['30m'].map(n=>n.toFixed(2)).join(' - ');
                document.getElementById('r60').innerText = data.ranges['60m'].map(n=>n.toFixed(2)).join(' - ');
            } catch (e) {
                console.error("Waiting for data.json to be created by the bot...");
            }
        }

        // Update every 60 seconds
        setInterval(updateDashboard, 60000);
        updateDashboard();
    </script>
</body>
</html>
